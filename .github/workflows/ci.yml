name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (pinned)
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Version check
        run: zig version

      - name: Build
        run: zig build --summary all

      - name: Unit tests
        run: zig build test --summary all

      - name: Self-check smoke test
        run: |
          cat > /tmp/ci.toml <<'EOF'
          [app]
          environment = "development"
          instance_id = "ci"

          [exchange]
          provider = "okx"
          instrument = "BTC-USDT"
          mode = "shadow"

          [risk]
          max_drawdown = 0.10
          valuation = "conservative_liquidation"
          allow_runtime_override = false

          [storage]
          path = "/tmp/ci-trading.db"
          wal = true

          [web]
          bind = "127.0.0.1:8080"
          EOF
          ./zig-out/bin/alphabound --config /tmp/ci.toml --self-check
