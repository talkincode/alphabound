name: Docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "book.toml"
      - "docs/**"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "book.toml"
      - "docs/**"
      - "scripts/build-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Pages deploy needs these at the workflow level when using deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        env:
          MDBOOK_VERSION: "0.4.52"
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build handbook
        run: ./scripts/build-docs.sh check

      # Regular downloadable artifact (PRs + main)
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: alphabound-handbook
          path: book/book
          if-no-files-found: error
          retention-days: 14

      # GitHub Pages artifact (only main; required by deploy-pages)
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/book

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
