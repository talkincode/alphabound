# Example production config. Copy to /etc/alphabound/alphabound.toml
# Secrets: /etc/alphabound/secrets.env (0600) — never commit real keys.
# Modes: shadow (default, no orders) | demo (OKX_SIMULATED=1) |
#        live (small sub-account + OKX_REAL_MONEY_OK=1).

[app]
environment = "production"
instance_id = "btc-01"

[exchange]
provider = "okx"
instrument = "BTC-USDT"
mode = "shadow"               # set "live" for small-capital real money
poll_interval_ms = 5000

[risk]
max_drawdown = 0.10
valuation = "conservative_liquidation"
allow_runtime_override = false
taker_fee_rate = 0.001
slippage_rate = 0.0005
initial_capital = 100.0
min_trade_notional = 10              # USDT floor per trade; dust rebalances plan to HOLD (0 = venue min only)
min_rebalance_weight_delta = 0.01    # skip trades moving weight < 1%; suppresses fee-eroding micro-rebalances (0 = off)

[agent]
provider = "openai"
model = "gpt-4o-mini"
base_url = "https://api.openai.com/v1"
decision_timeout_ms = 180000
# Multi-factor slow-loop schedule: low base cadence + trading session +
# event triggers, all bounded by a hard cooldown floor. Not a HFT system.
decision_interval_ms = 900000        # 15 min base cadence in active session
decision_interval_quiet_ms = 3600000 # 60 min outside active session
decision_min_interval_ms = 180000    # 3 min hard floor between any two calls
active_hours_utc = "13-21"           # EU/US overlap; empty = always base
event_price_move = 0.005             # fire early on ≥0.5% move since last call
event_drawdown_step = 0.01           # fire early when drawdown deepens ≥1%
event_price_drift = 0.02             # fire when price has drifted ≥2% from the last traded price (cumulative across HOLDs, not dampened; 0 = off)
review_backoff_max_ms = 14400000     # honor HOLD review_after as backoff, capped at 4h (0 = legacy fixed cadence)
event_noop_backoff_max_ms = 1800000  # dampen price_move trigger after consecutive no-op decisions, capped at 30m (0 = off)
volatility_enter = 0.01             # ~15m (high-low)/low >=1% enters frequent review; omitted/0 = off
volatility_exit = 0.006             # <=0.6% continuously for exit_hold to leave frequent review
volatility_interval_ms = 180000     # 3m in high volatility; global decision_min_interval_ms still applies
volatility_exit_hold_ms = 900000    # 15m exit hysteresis; >90s tick gaps require new 15m warmup
prompt_dir = "/etc/alphabound/prompts"
enabled = true
llm_reflection = true
llm_reflection_on_hold = false       # HOLD cycles: deterministic reflection only ...
llm_reflection_hold_every = 6        # ... except every 6th consecutive no-op and whenever position/cash tension is set

[storage]
path = "/var/lib/alphabound/trading.db"
wal = true

# Periodic review (analysis-only; never touches orders/risk). 0 disables a
# cycle. timeout_ms is deliberately independent of agent.decision_timeout_ms
# above — the review prompt is batched and larger than a single decision, so
# a tight per-decision budget must not silently cap this call too.
[review]
short_interval_ms = 28800000  # 8h
long_interval_ms = 604800000  # 7d
timeout_ms = 180000           # min 30000

# Auth: set ALPHABOUND_API_TOKEN in secrets.env (not in this file).
# Intel ingest: ALPHABOUND_INTEL_HMAC in secrets.env (empty = ingest off).
# Optional WebAuthn: ALPHABOUND_WEBAUTHN_RP_ID / ALPHABOUND_WEBAUTHN_ORIGIN.
# Public/Azure: ALPHABOUND_TRUST_PROXY=1 when X-Forwarded-For is set by a trusted edge.
# In-process fail guard locks an IP after repeated bad tokens (see docs/DASHBOARD_AUTH_MCP.md).
[web]
# Prefer 127.0.0.1 and SSH tunnel; use 0.0.0.0 only on trusted private networks.
bind = "127.0.0.1:8080"
static_dir = "/opt/alphabound/ui/current"
